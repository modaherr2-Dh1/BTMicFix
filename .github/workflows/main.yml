name: Build BTMicFix APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build BTMicFix APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Controleer of APK is aangemaakt
        run: |
          echo "=== Zoeken naar aangemaakte APK bestanden ==="
          find . -name "*.apk" -not -path "*/intermediates/*"

      - name: Upload BTMicFix APK
        uses: actions/upload-artifact@v4
        with:
          name: BTMicFix-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
